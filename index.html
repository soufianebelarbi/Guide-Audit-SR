  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    html, body {
      height: 100%;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      background-color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    button, nav, header { -webkit-user-select: none; user-select: none; }
    /* Plein écran sur téléphone : zones sûres (encoche / barre d'accueil) */
    @media (max-width: 639px) {
      body { background-color: #F8FAFC; display: block; }
      #app-shell { width: 100vw; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      #app-header { padding-top: calc(var(--sat) + 0.75rem); padding-left: calc(var(--sal) + 1rem); padding-right: calc(var(--sar) + 1rem); }
      #app-nav { padding-bottom: calc(var(--sab) + 0.375rem); padding-left: calc(var(--sal) + 0.5rem); padding-right: calc(var(--sar) + 0.5rem); }
      #main-content { padding-left: var(--sal); padding-right: var(--sar); }
    }
    /* Anti-zoom iOS : champs à 16px minimum */
    input, select, textarea { font-size: 16px !important; }
    /* Cibles tactiles >= 44px */
    .nav-btn { min-height: 52px; }
    .rate-btn { min-width: 48px; min-height: 40px; }
    .touch-target { min-height: 44px; }
    button:active { transform: scale(0.97); }
    #main-content { -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    /* Custom scrollbar for mobile frame */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    .shake { animation: shake 0.35s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>

<script>
// ============================================================================
// BASE DE DONNÉES COMPLÈTE : 22 PROCESSUS & 350 CRITÈRES D'AUDIT S/R (FORVIA)
// Référence : FST-F-LSE-3925 — Issue n°4 (04/25)
// ============================================================================

const AUDIT_DATABASE = [
  {
    id: 1,
    code: "P01",
    name: "Questions Transversales",
    enName: "Transversal Questions",
    icon: "🌐",
    description: "Exigences générales applicables à l'ensemble du site : gestion des modifications, dérogations, alertes S/R, formation des opérateurs, maintenance préventive, FMEA et réactions aux dérives.",
    criteria: [
      { id: "1.1", theme: "Gestion des changements (4M)", bp: false, fr: "Les modifications produit ou process (y compris la réimplantation d'équipements) sont-elles maîtrisées via un processus structuré garantissant la conformité continue aux exigences S/R ?", en: "Are product or process changes (including equipment relocation) controlled through a structured process ensuring ongoing compliance with S/R requirements?" },
      { id: "1.2", theme: "Gestion des dérogations", bp: true, fr: "Toute dérogation affectant une caractéristique S/R est-elle formellement approuvée via le formulaire FAU-F-DSG-0002 avant expédition ou utilisation ?", en: "Is any deviation affecting an S/R characteristic formally approved via FAU-F-DSG-0002 prior to shipment or use?" },
      { id: "1.3", theme: "20 Règles Obligatoires S/R", bp: false, fr: "Les 20 règles obligatoires Sécurité & Réglementation (FAU-C-DSG-3530) sont-elles connues, déployées et appliquées sur les lignes concernées ?", en: "Are the 20 mandatory Safety & Regulation rules (FAU-C-DSG-3530) known, deployed, and applied on relevant lines?" },
      { id: "1.4", theme: "Alerte Situations Sensibles", bp: false, fr: "La procédure d'alerte sur situations sensibles (FAU-P-LSC-7000) est-elle appliquée immédiatement en cas d'incident ou de doute sur une pièce S/R ?", en: "Is the sensitive situation alert procedure (FAU-P-LSC-7000) immediately applied in case of an incident or doubt on an S/R part?" },
      { id: "1.5", theme: "Identification des postes S/R", bp: false, fr: "Les postes de travail et opérations générant ou contrôlant des caractéristiques S/R (KPC/KCC) sont-ils clairement identifiés sur le terrain (pictogramme S/R) ?", en: "Are workstations and operations generating or controlling S/R characteristics (KPC/KCC) clearly identified on the shopfloor (S/R pictogram)?" },
      { id: "1.6", theme: "Qualification & Habilitation opérateurs", bp: false, fr: "Les opérateurs et régleurs intervenant sur des postes S/R disposent-ils d'une habilitation valide, à jour et affichée au poste ?", en: "Do operators and setters working on S/R stations hold valid, up-to-date qualification displayed at the station?" },
      { id: "1.7", theme: "Remplacement & Polyvalence", bp: false, fr: "En cas d'absence d'un opérateur titulaire sur un poste S/R, le remplaçant est-il formellement qualifié et enregistré dans la matrice de polyvalence ?", en: "In case of absence of a regular operator on an S/R station, is the replacement formally qualified and recorded in the skills matrix?" },
      { id: "1.8", theme: "Instructions de travail standard", bp: false, fr: "Les instructions de travail au poste intègrent-elles explicitement les points de vigilance S/R, les contrôles requis et les règles de réaction ?", en: "Do workstation instructions explicitly integrate S/R vigilance points, required checks, and reaction rules?" },
      { id: "1.9", theme: "Analyse AMDEC Process (PFMEA)", bp: false, fr: "L'AMDEC Process identifie-t-elle toutes les caractéristiques S/R avec une sévérité appropriée (9-10) et des actions de prévention/détection efficaces ?", en: "Does the PFMEA identify all S/R characteristics with appropriate severity (9-10) and effective prevention/detection actions?" },
      { id: "1.10", theme: "Plan de Surveillance (Control Plan)", bp: false, fr: "Le Plan de Surveillance est-il cohérent avec l'AMDEC Process et appliqué strictement en production (fréquences, tailles d'échantillons, moyens) ?", en: "Is the Control Plan consistent with the PFMEA and strictly applied in production (frequencies, sample sizes, gages)?" },
      { id: "1.11", theme: "Capitalisation Retour d'Expérience (LLS)", bp: false, fr: "Les fiches Lessons Learned (LLS) issues d'incidents S/R internes ou d'autres usines Forvia sont-elles intégrées dans les standards et vérifiées ?", en: "Are Lessons Learned Sheets (LLS) from internal S/R incidents or other Forvia plants integrated into standards and verified?" },
      { id: "1.12", theme: "Validation Poka-Yoke & Détrompeurs", bp: false, fr: "Tous les dispositifs Poka-Yoke liés aux caractéristiques S/R sont-ils testés à chaque démarrage d'équipe à l'aide de pièces maîtres (rouges/témoins) ?", en: "Are all Poka-Yoke devices linked to S/R characteristics tested at every shift start using master (red/rabbit) parts?" },
      { id: "1.13", theme: "Pièces maîtres (Red Rabbits)", bp: false, fr: "Les pièces maîtres servant à tester les Poka-Yoke sont-elles clairement identifiées, protégées, étalonnées et représentatives des défauts S/R ?", en: "Are master parts used to test Poka-Yoke clearly identified, protected, calibrated, and representative of S/R defects?" },
      { id: "1.14", theme: "Mode dégradé / Bypass Poka-Yoke", bp: false, fr: "Existe-t-il une règle stricte interdisant le contournement (bypass) d'un Poka-Yoke sans autorisation écrite et contrôle 100% de substitution ?", en: "Is there a strict rule prohibiting bypassing a Poka-Yoke without written authorization and 100% substitute inspection?" },
      { id: "1.15", theme: "Capabilité Process (Cpk / Ppk)", bp: false, fr: "Les caractéristiques KPC/KCC S/R font-elles l'objet d'un suivi SPC avec des indices de capabilité conformes aux exigences client et Forvia ?", en: "Are S/R KPC/KCC characteristics monitored via SPC with capability indices meeting customer and Forvia requirements?" },
      { id: "1.16", theme: "Conservation des enregistrements S/R", bp: false, fr: "Les enregistrements liés aux caractéristiques S/R sont-ils archivés de manière sécurisée et récupérable conformément à la procédure FAU-P-LSC-5600 (durée légale) ?", en: "Are records related to S/R characteristics securely archived and retrievable per procedure FAU-P-LSC-5600 (legal retention period)?" },
      { id: "1.17", theme: "Audits internes S/R", bp: false, fr: "Les audits internes S/R sont-ils planifiés et réalisés selon la procédure FAU-P-LSC-3900 avec suivi rigoureux des plans d'actions ?", en: "Are internal S/R audits planned and conducted per procedure FAU-P-LSC-3900 with rigorous action plan follow-up?" },
      { id: "1.18", theme: "Gestion des fournisseurs S/R", bp: false, fr: "Les sous-traitants et fournisseurs livrant des composants S/R sont-ils audités et suivis sur leurs caractéristiques critiques ?", en: "Are subcontractors and suppliers delivering S/R components audited and monitored on their critical characteristics?" },
      { id: "1.19", theme: "Résolution de problèmes 8D", bp: false, fr: "Tout écart sur une caractéristique S/R déclenche-t-il une analyse 8D approfondie avec vérification de l'efficacité des actions correctives ?", en: "Does any deviation on an S/R characteristic trigger a thorough 8D analysis with verification of corrective action effectiveness?" },
      { id: "1.20", theme: "Validation redémarrage après arrêt", bp: false, fr: "Une procédure de validation (OK 1ère pièce) est-elle appliquée après tout arrêt prolongé, changement d'outil, panne ou maintenance ?", en: "Is a validation procedure (OK 1st part) applied after any extended stop, tool change, breakdown, or maintenance?" },
      { id: "1.21", theme: "Étalonnage des moyens de contrôle", bp: false, fr: "Tous les moyens de mesure et d'essai utilisés pour valider des caractéristiques S/R sont-ils étalonnés, identifiés et dans leur période de validité ?", en: "Are all measurement and test equipment used to validate S/R characteristics calibrated, identified, and within validity period?" },
      { id: "1.22", theme: "Règle d'escalade et arrêt de ligne", bp: false, fr: "Les opérateurs et superviseurs appliquent-ils la règle d'arrêt immédiat de ligne (« Stop at First Defect ») en cas de non-conformité S/R ?", en: "Do operators and supervisors apply the immediate line stop rule ('Stop at First Defect') in case of S/R non-conformity?" },
      { id: "1.23", theme: "Clarté des spécifications client", bp: false, fr: "Les exigences spécifiques client (CSR) relatives à la sécurité et à la réglementation sont-elles traduites dans les documents internes d'atelier ?", en: "Are Customer Specific Requirements (CSR) related to safety and regulation translated into internal shopfloor documents?" },
      { id: "1.24", theme: "Sécurité des données automates/IT", bp: false, fr: "Les programmes automates (PLC), recettes et sauvegardes des équipements S/R sont-ils protégés contre toute modification non autorisée ?", en: "Are PLC programs, recipes, and backups of S/R equipment protected against unauthorized modification?" },
      { id: "1.25", theme: "Revue de direction S/R", bp: false, fr: "Les indicateurs de performance S/R, résultats d'audits et incidents sont-ils revus régulièrement par la direction du site ?", en: "Are S/R performance indicators, audit results, and incidents regularly reviewed by plant management?" }
    ]
  },
  {
    id: 2,
    code: "P02",
    name: "Laboratoire",
    enName: "Laboratory",
    icon: "🔬",
    description: "Contrôle des essais destructifs et non destructifs en laboratoire : étalonnage, méthodes d'essai, habilitation des techniciens, traçabilité des éprouvettes et libération des lots.",
    criteria: [
      { id: "2.1", theme: "Habilitation techniciens labo", bp: false, fr: "Les techniciens réalisant les essais S/R (traction, coupe macrographique, dureté, brouillard salin) sont-ils formellement qualifiés et habilités ?", en: "Are technicians performing S/R tests (tensile, macro cut, hardness, salt spray) formally qualified and authorized?" },

  } catch (e) {}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0');
  t.classList.add('opacity-100');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    t.classList.remove('opacity-100');
    t.classList.add('opacity-0');
  }, 2200);
}

// ============================================================================
// CALCULS & STATISTIQUES GLOBALES
// ============================================================================
function getGlobalStats() {
  let totalCriteria = 0;
  let totalBP = 0;
  let countOK = 0;
  let countNOK = 0;
  let countND = 0;
  let countNA = 0;
  let bpNOKList = [];

  AUDIT_DATABASE.forEach(proc => {
    proc.criteria.forEach(c => {
      totalCriteria++;
      if (c.bp) totalBP++;
      const r = state.ratings[c.id];
      if (r === 'OK') countOK++;
      else if (r === 'NOK') {
        countNOK++;
        if (c.bp) bpNOKList.push({ ...c, procName: proc.name, procCode: proc.code });
      }
      else if (r === 'ND') countND++;
      else if (r === 'NA') countNA++;
    });
  });

  const evaluated = countOK + countNOK + countND + countNA;
  const applicableEvaluated = (countOK + countNOK + countND);
  // Formule : (Nb OK + 0.5 * Nb ND) / (Nb évalués applicables)
  const complianceScore = applicableEvaluated > 0
    ? ((countOK + 0.5 * countND) / applicableEvaluated) * 100
    : null;

  return {
    totalProcesses: AUDIT_DATABASE.length,
    totalCriteria,
    totalBP,
    countOK,
    countNOK,
    countND,
    countNA,
    evaluated,
    applicableEvaluated,
    complianceScore,
    bpNOKList
  };
}

function getProcessStats(proc) {
  let bpCount = 0;
  let ok = 0, nok = 0, nd = 0, na = 0;
  proc.criteria.forEach(c => {
    if (c.bp) bpCount++;
    const r = state.ratings[c.id];
    if (r === 'OK') ok++;
    else if (r === 'NOK') nok++;
    else if (r === 'ND') nd++;
    else if (r === 'NA') na++;
  });
  return { total: proc.criteria.length, bpCount, ok, nok, nd, na };
}

// ============================================================================
function switchTab(tabName) {
  state.activeTab = tabName;
  if (tabName !== 'processes') {
    state.selectedProcessId = null;
  }
  updateNavUI();
  renderCurrentView();
  document.getElementById('main-content').scrollTop = 0;
}

function updateNavUI() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const isTarget = btn.getAttribute('data-tab') === state.activeTab;
    if (isTarget) {
      btn.classList.remove('text-slate-500');
      btn.classList.add('text-forvia-cyan', 'bg-sky-50');
    } else {
      btn.classList.add('text-slate-500');
      btn.classList.remove('text-forvia-cyan', 'bg-sky-50');
    }
  });
}

function toggleEnglishGlobal() {
  state.showEnglish = !state.showEnglish;
  saveState();
  updateLangButtonUI();
  renderCurrentView();
  showToast(state.showEnglish ? "Texte anglais original affiché" : "Texte anglais original masqué");
}

function updateLangButtonUI() {
  const dot = document.getElementById('en-status-dot');
  const btn = document.getElementById('btn-lang-toggle');
  if (state.showEnglish) {
    dot.classList.remove('bg-slate-400');
    dot.classList.add('bg-emerald-400');
    btn.classList.add('bg-white/25', 'border-sky-300');
  } else {
    dot.classList.add('bg-slate-400');
    dot.classList.remove('bg-emerald-400');
    btn.classList.remove('bg-white/25', 'border-sky-300');
  }
}

function openProcessDetail(procId) {
  state.activeTab = 'processes';
  state.selectedProcessId = procId;
  try { history.pushState({ detail: procId }, ''); } catch (e) {}
  updateNavUI();
  renderCurrentView();
  document.getElementById('main-content').scrollTop = 0;
}

function closeProcessDetail(fromPop) {
  if (!fromPop) { try { if (history.state && history.state.detail) { history.back(); return; } } catch (e) {} }
  state.selectedProcessId = null;
  renderCurrentView();
  document.getElementById('main-content').scrollTop = 0;
}

function setCriterionRating(critId, value) {
  if (state.ratings[critId] === value) {
    delete state.ratings[critId];
  } else {
    state.ratings[critId] = value;
  }
  saveState();
  try { if (navigator.vibrate) navigator.vibrate(value === 'NOK' ? [20, 40, 20] : 12); } catch (e) {}
  // Re-render lightweight or current view
  renderCurrentView(true);
}

function resetAllRatings() {
  state.ratings = {};
  saveState();
  renderCurrentView();
  showToast("Auto-évaluation réinitialisée");
}

function handleHomeSearch(val) {
  state.homeSearchQuery = val;
  renderCurrentView(true);
  const input = document.getElementById('home-search-input');
  if (input) {

}

function clearHomeSearch() {
  state.homeSearchQuery = '';
  renderCurrentView();
}

// VUE 3 : POINTS BLOQUANTS (FOCUS CRITIQUE — LES 79 BP)
// ============================================================================
function renderBlockingPointsView() {
  // Collect all 79 BP
  const allBP = [];
  AUDIT_DATABASE.forEach(proc => {
    proc.criteria.forEach(c => {
      if (c.bp) {
        allBP.push({ ...c, procId: proc.id, procCode: proc.code, procName: proc.name });
      }
    });
  });

  // Theme classification helper
  function getBPThemeCategory(c) {
    const text = (c.theme + ' ' + c.fr).toLowerCase();
    if (text.includes('verrouill') || text.includes('paramètre') || text.includes('recette')) return 'Paramètres verrouillés';
    if (text.includes('ok 1ère') || text.includes('ok1p') || text.includes('requalification')) return 'OK 1ère Pièce & Requalif';
    if (text.includes('courbe') || text.includes('surveillance') || text.includes('poka-yoke') || text.includes('détection') || text.includes('eol') || text.includes('pyromètre') || text.includes('lwm')) return 'Détection & Surveillance 100%';
    if (text.includes('reprise') || text.includes('rebut') || text.includes('blocage') || text.includes('éjection') || text.includes('dérogation')) return 'Blocage, Reprise & Rebuts';
    return 'Traçabilité, Labo & Matière';
  }

  const filteredBP = allBP.filter(item => {
    const matchProc = state.bpFilterProcess === 'ALL' || String(item.procId) === String(state.bpFilterProcess);
    const matchTheme = state.bpFilterTheme === 'ALL' || getBPThemeCategory(item) === state.bpFilterTheme;
    return matchProc && matchTheme;
  });

  const themes = [
    'ALL',
    'Paramètres verrouillés',
    'Détection & Surveillance 100%',
    'OK 1ère Pièce & Requalif',
    'Blocage, Reprise & Rebuts',
    'Traçabilité, Labo & Matière'
  ];

  return `
    <div class="p-4 space-y-3.5 animate-fade">
      <!-- Warning Banner -->
      <div class="bg-gradient-to-br from-red-600 to-red-700 text-white rounded-2xl p-4 shadow-md">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-extrabold uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-lg">Tolérance Zéro S/R</span>
          <span class="font-mono text-sm font-extrabold">${allBP.length} Points Bloquants</span>
        </div>
        <h2 class="text-base font-extrabold mt-1.5">Critères Bloquants (BP)</h2>
        <p class="text-xs text-red-100 mt-1 leading-relaxed">
          Tout écart (<strong>NOK</strong>) sur l'un de ces 79 critères invalide immédiatement le résultat de l'audit S/R et impose un arrêt / confinement du flux.
        </p>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm space-y-2.5">
        <div>
          <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">Filtrer par Processus</label>
          <select onchange="setBPFilterProcess(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold text-slate-800 outline-none focus:border-forvia-cyan">
            <option value="ALL" ${state.bpFilterProcess === 'ALL' ? 'selected' : ''}>Tous les processus (${allBP.length} BP)</option>
            ${AUDIT_DATABASE.map(p => {
              const cnt = p.criteria.filter(c => c.bp).length;
              return `<option value="${p.id}" ${String(state.bpFilterProcess) === String(p.id) ? 'selected' : ''}>${p.code} — ${p.name} (${cnt} BP)</option>`;
            }).join('')}
          </select>
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">Filtrer par Thématique</label>
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
            ${themes.map(th => `
              <button onclick="setBPFilterTheme('${th}')" class="shrink-0 text-[11px] font-semibold px-2.5 py-1.5 rounded-xl border transition ${state.bpFilterTheme === th ? 'bg-red-600 text-white border-red-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:border-red-300'}">
                ${th === 'ALL' ? 'Tous les thèmes' : th}
              </button>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between px-1">
        <span class="text-xs font-bold text-slate-700">${filteredBP.length} Point(s) Bloquant(s) affiché(s)</span>
        ${(state.bpFilterProcess !== 'ALL' || state.bpFilterTheme !== 'ALL') ? `
          <button onclick="resetBPFilters()" class="text-xs font-semibold text-forvia-cyan">Réinitialiser filtres</button>
        ` : ''}
      </div>

      <!-- List of BP Cards -->
      <div class="space-y-3">
        ${filteredBP.map(item => renderCriterionCard(item, `${item.procCode} • ${item.procName}`)).join('')}
      </div>
    </div>
  `;
}

function setBPFilterProcess(val) {
  state.bpFilterProcess = val;
  renderCurrentView();
}

function setBPFilterTheme(val) {
  state.bpFilterTheme = val;
  renderCurrentView();
}

function resetBPFilters() {
  state.bpFilterProcess = 'ALL';
  state.bpFilterTheme = 'ALL';
  renderCurrentView();
}

// ============================================================================
// VUE 4 : SIMULATEUR D'AUTO-AUDIT & GLOSSAIRE S/R
// ============================================================================
function renderSimulatorAndGlossaryView() {
  const stats = getGlobalStats();
  const hasBPBlocker = stats.bpNOKList.length > 0;
  const scoreDisplay = stats.complianceScore !== null ? stats.complianceScore.toFixed(1) + '%' : '—';

  let statusBadge = `<span class="text-xs font-bold px-2.5 py-1 rounded-xl bg-slate-100 text-slate-600">Aucune évaluation</span>`;
  if (stats.applicableEvaluated > 0) {
    if (hasBPBlocker) {
      statusBadge = `<span class="text-xs font-extrabold px-2.5 py-1 rounded-xl bg-red-600 text-white">AUDIT BLOQUÉ (BP NOK)</span>`;
    } else if (stats.complianceScore >= 90) {
      statusBadge = `<span class="text-xs font-extrabold px-2.5 py-1 rounded-xl bg-emerald-600 text-white">CONFORME (≥ 90%)</span>`;
    } else {
      statusBadge = `<span class="text-xs font-extrabold px-2.5 py-1 rounded-xl bg-amber-500 text-white">PLAN D'ACTION REQUIS</span>`;
    }
  }

  const gq = state.glossarySearch.trim().toLowerCase();
  const filteredGlossary = GLOSSARY_TERMS.filter(g =>
    !gq || g.term.toLowerCase().includes(gq) || g.full.toLowerCase().includes(gq) || g.desc.toLowerCase().includes(gq)
  );

  // Process breakdown for evaluated items
  const evaluatedProcesses = AUDIT_DATABASE.map(proc => {
    const ps = getProcessStats(proc);
    const app = ps.ok + ps.nok + ps.nd;
    const pct = app > 0 ? ((ps.ok + 0.5 * ps.nd) / app) * 100 : null;
    return { proc, ps, app, pct };
  }).filter(x => x.ps.ok + x.ps.nok + x.ps.nd + x.ps.na > 0);

  return `
    <div class="p-4 space-y-4 animate-fade">
      <!-- Real-Time Self-Audit Simulator Card -->
      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-forvia-cyan">Simulation Terrain</span>
            <h2 class="text-base font-extrabold text-forvia-navy">Simulateur d'Auto-Audit</h2>
          </div>
          ${statusBadge}
        </div>

        <div class="bg-slate-900 text-white rounded-2xl p-4 flex items-center justify-between">
          <div>
            <div class="text-[11px] text-slate-400 font-medium">Indice de Conformité Calculé</div>
            <div class="text-3xl font-extrabold mt-0.5 ${hasBPBlocker ? 'text-red-400' : 'text-sky-400'}">
              ${scoreDisplay}
            </div>
            <div class="text-[10px] text-slate-400 mt-1">
              ${stats.evaluated} / ${stats.totalCriteria} critères évalués
            </div>
          </div>

          <div class="grid grid-cols-2 gap-1.5 text-center text-xs">
            <div class="bg-emerald-500/20 border border-emerald-500/30 px-2.5 py-1.5 rounded-xl">
              <div class="font-extrabold text-emerald-400">${stats.countOK}</div>
              <div class="text-[9px] text-emerald-200">OK</div>
            </div>
            <div class="bg-red-500/20 border border-red-500/30 px-2.5 py-1.5 rounded-xl">
              <div class="font-extrabold text-red-400">${stats.countNOK}</div>
              <div class="text-[9px] text-red-200">NOK</div>
            </div>
            <div class="bg-amber-500/20 border border-amber-500/30 px-2.5 py-1.5 rounded-xl">
              <div class="font-extrabold text-amber-400">${stats.countND}</div>
              <div class="text-[9px] text-amber-200">ND (0,5)</div>
            </div>
            <div class="bg-slate-500/20 border border-slate-500/30 px-2.5 py-1.5 rounded-xl">
              <div class="font-extrabold text-slate-300">${stats.countNA}</div>
              <div class="text-[9px] text-slate-300">NA</div>
            </div>
          </div>
        </div>

        ${hasBPBlocker ? `
          <div class="bg-red-50 border border-red-300 rounded-xl p-3">
            <div class="text-xs font-extrabold text-red-700 flex items-center gap-1.5">
              <span>⚠️ Alerte : ${stats.bpNOKList.length} Point(s) Bloquant(s) NOK détecté(s) !</span>
            </div>
            <ul class="mt-1.5 space-y-1 text-[11px] text-red-800">
              ${stats.bpNOKList.map(bp => `
                <li>• <strong>#${bp.id} (${bp.procCode})</strong> : ${bp.theme}</li>
              `).join('')}
            </ul>
          </div>
        ` : ''}

        ${evaluatedProcesses.length > 0 ? `
          <div class="space-y-1.5 pt-1">
            <div class="text-[11px] font-bold text-slate-600">Détail par processus évalué :</div>
            ${evaluatedProcesses.map(({ proc, ps, pct }) => `
              <div onclick="openProcessDetail(${proc.id})" class="cursor-pointer flex items-center justify-between p-2 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-100 text-xs">
                <span class="font-semibold text-slate-800 truncate pr-2">${proc.code} • ${proc.name}</span>
                <span class="font-mono font-bold shrink-0 ${pct !== null && pct < 90 ? 'text-amber-600' : 'text-emerald-600'}">
                  ${pct !== null ? pct.toFixed(0) + '%' : 'NA'} (${ps.ok} OK / ${ps.nok} NOK)
                </span>
              </div>
            `).join('')}
          </div>
        ` : `
          <p class="text-xs text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-100">
            💡 Cochez <strong>OK, NOK, ND ou NA</strong> sur n'importe quel critère dans les onglets <em>Processus</em> ou <em>Bloquants</em> pour simuler votre score d'audit en temps réel.
          </p>
        `}

        ${stats.evaluated > 0 ? `
          <button onclick="resetAllRatings()" class="w-full py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50 transition">
            Réinitialiser l'auto-évaluation
          </button>
        ` : ''}
      </div>

      <!-- Glossary Section -->
      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-forvia-cyan">Terminologie Technique</span>
          <h3 class="text-base font-extrabold text-forvia-navy">Glossaire des Acronymes S/R</h3>
        </div>

        <input
          type="text"
          value="${state.glossarySearch.replace(/"/g, '&quot;')}"
          oninput="handleGlossarySearch(this.value)"
          placeholder="Filtrer un acronyme (ex: OK1P, KPC, CCPU, 4D LWM...)"
          class="w-full bg-slate-50 border border-slate-200 focus:border-forvia-cyan rounded-xl px-3.5 py-2.5 text-xs font-medium outline-none"
        />

        <div class="space-y-2.5">
          ${filteredGlossary.map(item => `
            <div class="p-3 rounded-xl bg-slate-50 border border-slate-100">
              <div class="flex items-center justify-between gap-2">
                <span class="font-mono text-xs font-extrabold text-white bg-forvia-blue px-2 py-0.5 rounded-lg">${item.term}</span>
                <span class="text-[11px] font-bold text-forvia-cyan text-right">${item.full}</span>
              </div>
              <p class="text-xs text-slate-700 mt-1.5 leading-relaxed">${item.desc}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function handleGlossarySearch(val) {
  state.glossarySearch = val;
  renderCurrentView(true);
}

// ============================================================================
// RENDU PRINCIPAL
// ============================================================================
function renderCurrentView(preserveScroll = false) {
  const container = document.getElementById('main-content');
  const scrollPos = container.scrollTop;

  let html = '';
  if (state.activeTab === 'home') html = renderHomeView();
  else if (state.activeTab === 'processes') html = renderProcessesView();
  else if (state.activeTab === 'bp') html = renderBlockingPointsView();
  else if (state.activeTab === 'simulator') html = renderSimulatorAndGlossaryView();

  container.innerHTML = html;
  if (preserveScroll) {
    container.scrollTop = scrollPos;
  }
}

window.addEventListener('popstate', function() {
  if (state.selectedProcessId !== null) closeProcessDetail(true);
});

['gesturestart', 'gesturechange'].forEach(function(ev) {
  document.addEventListener(ev, function(e) { e.preventDefault(); });
});

// ============================================================================
// VERROUILLAGE PAR MOT DE PASSE (empreinte uniquement, le mot de passe n'est pas stocké en clair)
// ============================================================================
const LOCK_SHA256 = "fd03f1b435aea479ae3dec7b46ee12d11c0b3271d2ff3bdc4bfe00149775a062";
const LOCK_FALLBACK = "74ae376b5d82e";
let lockFails = 0;
let lockBusyUntil = 0;
let appStarted = false;

function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

async function checkPassword(pw) {
  const salted = 'forvia-sr|' + pw;
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salted));
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      return hex === LOCK_SHA256;
    }
  } catch (e) {}
  return cyrb53(salted) === LOCK_FALLBACK;
}

function startApp() {
  if (appStarted) return;
  appStarted = true;
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = '';
  updateLangButtonUI();
  updateNavUI();
  renderCurrentView();
}

async function submitLock(e) {
  e.preventDefault();
  const input = document.getElementById('lock-input');
  const err = document.getElementById('lock-error');
  const now = Date.now();
  if (now < lockBusyUntil) {
    err.textContent = 'Patientez ' + Math.ceil((lockBusyUntil - now) / 1000) + ' s avant de réessayer.';
    return false;
  }
  if (await checkPassword(input.value)) {
    try { sessionStorage.setItem('forvia_sr_unlocked', '1'); } catch (x) {}
    input.value = '';
    startApp();
  } else {
    lockFails++;
    if (lockFails >= 3) lockBusyUntil = Date.now() + Math.min(30, 3 * (lockFails - 2)) * 1000;
    err.textContent = 'Mot de passe incorrect.';
    input.value = '';
    const f = document.getElementById('lock-field');
    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    if (navigator.vibrate) { try { navigator.vibrate([30, 40, 30]); } catch (x) {} }
    input.focus();
  }
  return false;
}

function lockApp() {
  try { sessionStorage.removeItem('forvia_sr_unlocked'); } catch (x) {}
  location.reload();
}

window.onload = function() {
  let unlocked = false;
  try { unlocked = sessionStorage.getItem('forvia_sr_unlocked') === '1'; } catch (x) {}
  if (unlocked) startApp();
  else setTimeout(function() { const i = document.getElementById('lock-input'); if (i) i.focus(); }, 150);
};
</script>
